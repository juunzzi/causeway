# ⚠️ 이 파일은 **예시다. 지금 위치에서는 실행되지 않는다** — GitHub 은
# `.github/workflows/` 안의 파일만 워크플로로 인식한다.
#
# 여기 둔 이유: 이 레포에는 배포 대상이 없다(아무도 보일러플레이트 자체를 봇으로 돌리지
# 않는다). 그런데 `.github/workflows/` 에 두면 트리거를 꺼놔도 Actions 탭에 "deploy" 가
# 뜨고, 누군가 Run workflow 를 누르면 있지도 않은 러너를 기다리며 **큐에 걸린 채 영원히
# 대기한다**(2026-08-11 실측: queued 2건 적체). fork 한 사람도 첫 push 부터 같은 것을 본다.
# 그래서 워크플로가 아닌 자리로 내렸다.
#
# ── 쓰는 법 ──────────────────────────────────────────────────────────────────
# ① 배포할 호스트에 self-hosted 러너를 등록한다. **레포 밖 경로에 설치할 것** — 러너 작업
#    디렉토리가 워킹트리를 더럽히면 `auto-update.sh` 의 "로컬 수정 있음" 게이트가 배포를
#    영구 보류시킨다.
# ② 아래 `runs-on` 의 라벨을 그 러너에 맞추고, 마지막 `run:` 의 경로를 봇이 실제로 도는
#    체크아웃 경로로 바꾼다.
# ③ 제자리로 옮긴다:  cp examples/deploy.yml .github/workflows/
#
# ── 이 워크플로가 하는 일 ────────────────────────────────────────────────────
# **배포 로직은 여기 없다.** `scripts/auto-update.sh`(525줄)가 유일한 배포 경로다 — pull →
# 의존성 동기화 → write 레인 유휴 대기 → 재시작 → 부팅 판정 → 실패 시 롤백·격리·통보까지.
# 이 파일이 하는 일은 그 스크립트를 지금 부르는 것뿐이다.
#
# 봇은 사람 머신에서 돌고 NAT 뒤에 있어 GitHub 이 인바운드로 찌를 수 없다. self-hosted
# 러너를 쓰는 것은 그 때문이다 — 러너가 아웃바운드 롱폴로 GitHub 에 붙으므로 방화벽·포트
# 개방이 필요 없다.
#
# ⚠️ 안전망이 없다는 뜻이기도 하다. 러너가 죽으면(절전·재부팅 직후·러너 크래시) 배포는
# 그대로 멈추고 GitHub 쪽에서는 job 이 큐에 걸린 채 조용하다. 그래서 `bin/causeway status`
# 가 "배포 뒤처짐"을 직접 드러낸다(deployed-sha vs origin/main). 오래 죽어 있었다면 손으로
# `bin/causeway update` 를 부르거나, 러너를 못 살리는 상황이면 `scripts/auto-update.sh` 를
# 인자 없이 실행해 폴링 모드로 임시 대체한다(SETUP.md §11).
name: deploy

on:
  # ci 성공 **이후**에만 — push 에 직접 걸면 테스트 결과를 기다리지 않고 배포한다.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # 러너가 죽어 있던 사이의 커밋을 손으로 따라잡을 때.
  workflow_dispatch:

jobs:
  deploy:
    # CI 실패·취소로는 배포하지 않는다. workflow_dispatch 에는 workflow_run 컨텍스트가 없다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, causeway]
    # 배포는 직렬이어야 한다 — 연달아 머지되면 두 배포가 같은 체크아웃을 동시에 만진다.
    # 진행 중인 배포는 죽이지 않는다(cancel-in-progress: false): 재시작 도중 잘리면
    # "pull 은 됐는데 재시작은 안 된" 상태가 남는다. 뒤 커밋은 다음 실행이 어차피 따라잡는다.
    concurrency:
      group: causeway-deploy
      cancel-in-progress: false
    # wait_for_idle 이 write 레인 유휴를 최대 30분(IDLE_TIMEOUT) 기다린다 — 그보다 넉넉히.
    timeout-minutes: 45
    permissions:
      contents: read # git fetch 에 필요한 최소 권한 — 아래 GIT_CONFIG 가 이 토큰을 쓴다.
    steps:
      - name: 배포 (auto-update --once)
        env:
          # workflow_run 트리거 자체가 CI 게이트다 — 스크립트가 `gh run list` 로 같은 판정을
          # 다시 하게 두면, 러너 셸의 gh 인증이 안 풀렸을 때 unknown(=fail-closed)으로 **배포가
          # 조용히 보류된다.** 게이트를 없애는 게 아니라 이미 통과한 게이트를 두 번 묻지 않는 것이다.
          CAUSEWAY_UPDATE_REQUIRE_CI: "0"

          # ── git 인증 (2026-08-10 실측 실패의 수정) ──────────────────────────────
          # 호스트의 git 은 credential.helper 로 `gh auth git-credential` 을 쓰고, 그 gh 는
          # 토큰을 **macOS keychain** 에 둔다. 그런데 러너는 launchd 로 떠서 로그인 GUI 세션의
          # keychain 에 닿지 못한다 — gh 가 토큰을 못 꺼내 `git fetch` 가 인증 실패로 끝났고,
          # auto-update.sh 는 그걸 "다음 주기에 재시도"로 흘려보냈다(배포 0건, 에러도 조용).
          #
          # 해결은 러너에 장기 토큰을 심는 게 아니라, **이 job 에만 발급되는 단명 토큰**을 쓰는
          # 것이다. GIT_CONFIG_* 로 helper 를 프로세스 범위에서만 덮으므로 호스트 ~/.gitconfig 도,
          # 배포 스크립트도 건드리지 않는다(git 2.31+).
          #   - 0: 기존 helper 를 **빈 값으로 리셋**. 이게 없으면 keychain 을 뒤지는 gh helper 가
          #        먼저 호출돼 같은 실패를 반복한다.
          #   - 1: 그 자리에 job 토큰을 뱉는 helper 를 넣는다.
          # 토큰은 helper 가 실행될 때 env 에서 읽는다 — 설정 값에 토큰 자체를 박지 않는다.
          GH_JOB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: '!f(){ echo username=x-access-token; echo "password=$GH_JOB_TOKEN"; };f'
        # 체크아웃하지 않는다 — 배포 대상은 러너 워크스페이스가 아니라 **봇이 실제로 돌고 있는
        # 호스트 체크아웃**이다. 경로가 상수인 것은 러너와 봇이 같은 맥북·같은 사용자로 묶여
        # 있기 때문이고, 그 전제가 깨지면(체크아웃 이전) 이 줄이 먼저 실패해 드러난다.
        run: ~/causeway/scripts/auto-update.sh --once
