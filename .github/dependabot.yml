# 의존성 갱신 PR 을 주에 한 번 연다.
#
# 보일러플레이트라 여기 낡은 버전이 **그걸 복사한 모든 레포로 퍼진다.** 사람이 기억해서 올리면
# 반드시 잊으므로 자동화한다. 갱신은 PR 로만 오고 CI 게이트를 그대로 통과해야 하므로,
# 자동으로 머지되는 것은 없다.
#
# 묶는 이유: 개별 PR 이 10개 열리면 아무도 안 본다. patch·minor 를 한 PR 로 묶어 리뷰가
# 실제로 일어나게 하고, major 만 따로 떼어 사람이 판단하게 한다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    commit-message:
      # CONTRIBUTING 의 `type: 설명` 규약 — squash merge 라 이게 곧 main 의 커밋 메시지다.
      prefix: chore
    groups:
      # 런타임 의존성과 도구를 가른다. 깨졌을 때 봐야 할 곳이 다르다.
      runtime:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      tooling:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # major 는 묶지 않고 개별 PR 로 온다 — 대개 마이그레이션이 딸려 있다.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # 워크플로가 쓰는 액션도 늙는다. 여기 방치하면 deprecated 런타임 경고가 어느 날 실패로 바뀐다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
