# 코드 스캐닝 — GitHub CodeQL.
#
# 이 봇의 세션은 **호스트에서 Bash 를 돌린다.** 경계를 코드로 만든다고 문서 곳곳에 적어놓고
# 정작 그 코드에 정적 분석이 하나도 안 걸려 있었다. 명령 조립·경로 처리·입력 검증처럼 사람
# 리뷰가 놓치기 쉬운 자리가 이 레포에는 실제로 있다(`runner/`, `security/`, `egress/`).
#
# 결과는 Security 탭의 Code scanning alerts 로 간다. **PR 을 막지는 않는다** — 정적 분석의
# 오탐을 머지 게이트로 삼으면 기여자가 우회할 방법을 찾게 되고, 그때부터 아무도 안 본다.
# 막아야 할 것은 이미 `ci`(check·typecheck·test)와 `gitleaks` 가 막고 있다.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 새 커밋이 없어도 규칙(query pack)은 갱신된다 — 어제 깨끗했던 코드가 오늘 걸릴 수 있다.
  schedule:
    - cron: "23 4 * * 1" # 매주 월요일. 정각을 피하는 것은 GitHub 권장(정각에 잡이 몰린다).

# 기본값(넓은 쓰기 권한)을 쓰지 않는다. 필요한 것만 준다.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # 경고를 Security 탭에 올린다 — 이 워크플로의 유일한 쓰기 권한
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          # TS 는 컴파일 없이 소스에서 바로 분석된다(빌드 스텝이 필요 없는 언어).
          languages: javascript-typescript
          # 기본 쿼리 + 보안 확장. `security-and-quality` 는 품질 규칙까지 켜서 소음이 늘어난다.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
